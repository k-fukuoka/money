<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本株 配当利回りグラフ | Dividend Yield Visualizer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            padding-top: 50px;
            padding-bottom: 50px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            overflow: hidden;
            margin-bottom: 30px;
        }
        .card-header {
            background-color: rgba(255,255,255,0.03);
            border-bottom: 1px solid #333;
            padding: 20px 25px;
        }
        .card-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }
        .form-control {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .form-control:focus {
            background-color: #2c2c2c;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            color: #fff;
        }
        .form-control::placeholder {
            color: #888;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: translateY(-1px);
        }
        .error-container {
            background-color: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #graph-container {
            width: 100%;
            height: 600px;
        }
        .footer {
            margin-top: 50px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
        .app-title {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #0d6efd, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @media (max-width: 768px) {
            #graph-container {
                height: 450px;
            }
            .container {
                padding-top: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center">
            <h1 class="app-title display-4">日本株 配当利回りグラフ</h1>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="card-title">証券コードを検索</h5>
            </div>
            <div class="card-body p-4">
                <form method="get" class="row g-3 justify-content-center">
                    <div class="col-md-7 col-sm-9">
                        <input type="text" name="code" class="form-control" placeholder="例: 7203 (トヨタ) または 7203.T" value="{{ code }}" required>
                    </div>
                    <div class="col-md-auto col-sm-3">
                        <button type="submit" class="btn btn-primary w-100">検索</button>
                    </div>
                </form>
                {% if error %}
                    <div class="error-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
                            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                        {{ error }}
                    </div>
                {% endif %}
            </div>
        </div>

        {% if graph_json %}
            <div class="card">
                <div class="card-body p-0">
                    <div id="graph-container"></div>
                </div>
            </div>
        {% endif %}

        {% if not code and not error %}
            <div class="text-center py-5">
                <p class="text-muted lead">
                    証券コードを入力すると、直近5年間の月次配当利回り（棒グラフ）と<br>月末終値（折れ線グラフ）を同時に表示します。
                </p>
                <div class="mt-4">
                    <span class="badge rounded-pill bg-secondary mx-1">7203</span>
                    <span class="badge rounded-pill bg-secondary mx-1">9432</span>
                    <span class="badge rounded-pill bg-secondary mx-1">8306</span>
                </div>
            </div>
        {% endif %}

        <div class="footer">
            <p>© 2025 株価・配当データ可視化ツール</p>
        </div>
    </div>

    {% if graph_json %}
        <script>
            var graphData = {{ graph_json|safe }};
            var config = {
                responsive: true,
                displayModeBar: false
            };
            Plotly.newPlot('graph-container', graphData.data, graphData.layout, config);
        </script>
    {% endif %}

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
